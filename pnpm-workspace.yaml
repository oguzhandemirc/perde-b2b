packages:
  - apps/*
  - packages/*

# React Native / Metro symlink'li node_modules ile sorun çıkarabiliyor; düz yapı kullanılır.
minimumReleaseAgeExclude:
  - '@expo/cli@58.1.11'
  - '@expo/schema-utils@58.0.2'
  - expo-modules-core@58.0.22
  - expo-modules-jsi@58.0.15
  - expo@58.0.14

nodeLinker: hoisted

# Kurulumda script çalıştırmasına izin verilen paketler (pnpm varsayılan olarak engeller).
allowBuilds:
  unrs-resolver: true

# NativeWind v5 RC: newer lightningcss versions fail to deserialize global.css.
overrides:
  lightningcss: 1.30.1
